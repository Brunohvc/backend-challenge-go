worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    map $http_x_correlation_id $edge_correlation_id {
        "~^[A-Za-z0-9._:-]{1,128}$" $http_x_correlation_id;
        default                     $request_id;
    }

    log_format api escape=json
        '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"requestTime":$request_time,'
        '"upstreamAddr":"$upstream_addr","upstreamStatus":"$upstream_status",'
        '"requestId":"$http_x_request_id","correlationId":"$sent_http_x_correlation_id"}';
    access_log /dev/stdout api;

    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream wallet {
        zone wallet 64k;

        server app-1:8080 resolve max_fails=1 fail_timeout=5s;
        server app-2:8080 resolve max_fails=1 fail_timeout=5s;
        server app-3:8080 resolve max_fails=1 fail_timeout=5s;

        keepalive 16;
        keepalive_timeout 50s;
    }

    server {
        listen 80;

        client_max_body_size 64k;
        error_page 413 @payload_too_large;
        error_page 502 504 = @unavailable;

        location / {
            proxy_pass http://wallet;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_next_upstream error timeout non_idempotent;
            proxy_next_upstream_tries 3;

            proxy_connect_timeout 2s;
            proxy_send_timeout 20s;
            proxy_read_timeout 20s;
        }

        location @payload_too_large {
            default_type application/problem+json;
            add_header Cache-Control no-store always;
            add_header X-Correlation-Id $edge_correlation_id always;
            return 413 '{"type":"about:blank","title":"Request Entity Too Large","status":413,"code":"PAYLOAD_TOO_LARGE","detail":"body exceeds 65536 bytes","correlationId":"$edge_correlation_id"}\n';
        }

        location @unavailable {
            default_type application/problem+json;
            add_header Cache-Control no-store always;
            add_header Retry-After 2 always;
            add_header X-Correlation-Id $edge_correlation_id always;
            return 503 '{"type":"about:blank","title":"Temporarily unavailable","status":503,"code":"TEMPORARILY_UNAVAILABLE","correlationId":"$edge_correlation_id"}\n';
        }
    }

    server {
        listen 127.0.0.1:81;
        access_log off;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
