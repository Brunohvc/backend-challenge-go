x-traced-replica: &traced-replica
  environment:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  depends_on:
    jaeger:
      condition: service_healthy

services:
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  app-1: *traced-replica
  app-2: *traced-replica
  app-3: *traced-replica
