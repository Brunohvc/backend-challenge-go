x-wallet-image: &wallet-image
  image: backend-challenge-go/wallet:local
  pull_policy: never

x-wallet-replica: &wallet-replica
  <<: *wallet-image
  entrypoint: ["/usr/local/bin/wallet"]
  environment: &wallet-replica-env
    HTTP_ADDR: ":8080"
    ADMIN_ADDR: ":9090"
    DATABASE_URL: postgres://wallet_app:wallet_app@postgres:5432/wallet?sslmode=disable
    OIDC_ISSUER: http://localhost:8080/realms/wagering
    OIDC_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
    AWS_ENDPOINT_URL: http://ministack:4566
    AWS_REGION: us-east-1
    AWS_SHARED_CREDENTIALS_FILE: /run/aws/credentials
    AWS_PROFILE: wallet-app
  volumes:
    - aws-shared:/run/aws:ro
  depends_on:
    postgres:
      condition: service_healthy
    keycloak:
      condition: service_healthy
    ministack:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    aws-provision:
      condition: service_completed_successfully
  stop_grace_period: 65s

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wallet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "wallet"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/keycloak/realm-wagering.json:/opt/keycloak/data/import/realm-wagering.json:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r status <&3
          [[ $$status == *' 200 '* ]]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  ministack:
    image: ministackorg/ministack:1.5.27
    environment:
      AUTH: "true"
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as r; r.urlopen('http://127.0.0.1:4566/_ministack/health', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    <<: *wallet-image
    build: .
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://wallet_owner:wallet_owner@postgres:5432/wallet?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  aws-provision:
    <<: *wallet-image
    entrypoint: ["/usr/local/bin/provision"]
    command: ["-credentials", "/shared/aws/credentials"]
    environment:
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - aws-shared:/shared/aws
    depends_on:
      ministack:
        condition: service_healthy
    restart: "no"

  app-1:
    <<: *wallet-replica
    environment:
      <<: *wallet-replica-env
      APP_INSTANCE_ID: app-1
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9091:9090"

  app-2:
    <<: *wallet-replica
    environment:
      <<: *wallet-replica-env
      APP_INSTANCE_ID: app-2
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:9092:9090"

  app-3:
    <<: *wallet-replica
    environment:
      <<: *wallet-replica-env
      APP_INSTANCE_ID: app-3
    ports:
      - "127.0.0.1:8083:8080"
      - "127.0.0.1:9093:9090"

  nginx:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app-1:
        condition: service_started
      app-2:
        condition: service_started
      app-3:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:81/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  aws:
    image: amazon/aws-cli:2.38.1
    profiles: ["tools"]
    environment:
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_REGION: us-east-1
      AWS_SHARED_CREDENTIALS_FILE: /run/aws/credentials
    volumes:
      - aws-shared:/run/aws:ro

volumes:
  pgdata:
  aws-shared:
